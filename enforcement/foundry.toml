[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Arc targets the Osaka hard fork and runs reth. PUSH0 is supported — the
# "evmVersion: paris" advice for Arc is obsolete. We compile to cancun because
# we want transient storage (TSTORE/TLOAD) for the reentrancy guard.
solc_version = "0.8.28"
evm_version = "cancun"

optimizer = true
optimizer_runs = 200

# Arc's testnet minimum base fee is 20 Gwei, and the docs warn that transactions below
# the floor "may remain pending indefinitely or fail outright". Foundry queries
# eth_gasPrice by default (currently ~21.5 Gwei); this floor means a stale or zero
# estimate can never produce a stuck deployment.
gas_price = 25000000000

# Reproducible builds: §3.2 requires verified source on ArcScan.
bytecode_hash = "none"
cbor_metadata = false

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 1024
max_test_rejects = 100000

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = false
shrink_run_limit = 5000

# CI turns the dials up. Merges are gated on this profile.
[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 1024
depth = 256

[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"

# ArcScan is Blockscout, not Etherscan. Per docs.arc.io/arc/tutorials/deploy-on-arc,
# verification needs --verifier blockscout with this URL; Blockscout does not require
# an API key, but Foundry wants the field present.
[etherscan]
arc_testnet = {key = "", url = "https://testnet.arcscan.app/api/", chain = 5042002}


[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
sort_imports = true
