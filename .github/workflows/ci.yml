name: CI

# Nothing gated a push before this. For software whose entire claim is "it stops things",
# an untested merge is the failure mode that matters most — a regression in `_evaluate` or
# in the reason-code table does not crash, it silently permits.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # forge-std and openzeppelin-contracts are pinned submodules, not npm packages.
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check formatting
        run: forge fmt --check
        working-directory: enforcement

      - name: Build
        run: forge build --sizes
        working-directory: enforcement

      # The `ci` profile turns the dials up: 10,000 fuzz runs against the default 1,024, and
      # 1,024 invariant runs at depth 256. A merge is worth more compute than a local edit.
      - name: Test
        run: forge test -vv
        working-directory: enforcement
        env:
          FOUNDRY_PROFILE: ci

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Type stripping runs the .ts sources directly — no build step anywhere in this
          # repo. That needs a Node new enough to strip types natively.
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm --filter @tollgate/dashboard lint

      # Unit tests only. `agent/src/selftest.ts` is deliberately excluded: it spends real
      # testnet USDC against a live policy, so it can never be a merge gate.
      - name: Test
        run: pnpm test

  build:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A production build catches what dev mode forgives — and the dashboard has to build
      # before it can be deployed anywhere, which is the next item after this one.
      - name: Build
        run: pnpm --filter @tollgate/dashboard build
        env:
          # Placeholders. Every page handles an unconfigured environment by design, so the
          # build must not need a live contract or a funded key.
          POLICY_ENGINE_ADDRESS: ""
          OWNER_ADDRESS: ""
